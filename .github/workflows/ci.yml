name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Python 3.11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.lock

      # 锁文件安装：requirements.txt 为浮动约束（如 sqlalchemy>=2.0），
      # 上游发版（2.1 起 greenlet 改为 asyncio extra，默认不再安装）曾隔夜打红 CI
      - name: Install dependencies (locked)
        run: pip install -r requirements.lock -r requirements-dev.txt

      - name: Compile check (syntax + imports)
        run: python -m compileall -q app

      - name: Smoke import check
        run: python -c "import app.main"

      - name: Pytest
        run: python -m pytest -q
        env:
          AUTH_ENABLED: "true"
          AUTH_LOCALHOST_BYPASS: "false"
          API_KEYS: "key-a:tenant-a:user-a,key-b:tenant-b:user-b"
          RESEARCH_WORKER_COUNT: "0"

  frontend:
    name: Frontend (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Type check + build
        run: npm run build

  e2e:
    name: Playwright smoke
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.lock

      - name: Set up Node 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install backend deps
        run: pip install -r apps/api/requirements.lock -r apps/api/requirements-dev.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Install frontend deps
        working-directory: apps/web
        run: npm ci

      - name: Run UI smoke
        run: python eval/scripts/ui_smoke.py
