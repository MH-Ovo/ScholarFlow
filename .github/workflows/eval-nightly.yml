name: RAGAS nightly

on:
  schedule:
    - cron: "0 18 * * *"   # 每天 18:00 UTC
  workflow_dispatch:

# 需要一个已安装 Qdrant + 语料 + 模型的 self-hosted runner；没有 runner 时任务会排队而非误报
jobs:
  eval:
    runs-on: [self-hosted, scholarflow]
    timeout-minutes: 180
    env:
      SCHOLARFLOW_BASE: ${{ secrets.SCHOLARFLOW_EVAL_BASE }}
      SCHOLARFLOW_API_KEY: ${{ secrets.SCHOLARFLOW_EVAL_KEY }}
      EVAL_JUDGE_API_KEY: ${{ secrets.EVAL_JUDGE_API_KEY }}
      EVAL_JUDGE_BASE_URL: ${{ secrets.EVAL_JUDGE_BASE_URL }}
      EVAL_JUDGE_MODEL: ${{ secrets.EVAL_JUDGE_MODEL }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.lock

      - name: Install eval deps
        run: pip install -r apps/api/requirements.lock -r apps/api/requirements-eval.txt

      - name: Run RAGAS (retrieval layer, against deployment)
        working-directory: apps/api
        run: |
          ../../.venv/bin/python ../../eval/scripts/eval_ragas_academic.py \
            --dataset ../../eval/dataset_scholarflow.json \
            --skip-generation \
            --tag nightly_retrieval \
            --sequential --sleep 2

      - name: Gate faithfulness retrieval
        run: python eval/scripts/ragas_gate.py --input "$(ls -t eval/results/ragas_nightly_retrieval_*.json | head -1)" --min-context 0.82 --min-faithfulness 0

      - name: Run RAGAS (generation layer, against deployment)
        working-directory: apps/api
        run: |
          ../../.venv/bin/python ../../eval/scripts/eval_ragas_academic.py \
            --dataset ../../eval/dataset_scholarflow.json \
            --skip-retrieval \
            --tag nightly \
            --sequential --sleep 2

      - name: Gate
        run: python eval/scripts/ragas_gate.py --input "$(ls -t eval/results/ragas_nightly_[0-9]*.json | head -1)" --min-context 0.82 --min-faithfulness 0.82
